name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2 ruff==0.17.6
      - name: Lint
        run: python -m ruff check src workflows tests examples
      - name: Test
        run: python -m pytest -q
