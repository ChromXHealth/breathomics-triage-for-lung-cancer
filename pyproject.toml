[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end synthetic workflow test",
]

[tool.ruff]
target-version = "py39"
line-length = 110
exclude = [
    "examples/synthetic-data",
    "examples/synthetic-output",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
